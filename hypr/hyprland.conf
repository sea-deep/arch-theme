# ── Section ──
# Variables
$mainMod = SUPER
$term = kitty
$file_explorer = thunar
$browser = zen-browser

# ── Section ──
# Monitors
# Matches output 'AU Optronics 0x323D Unknown' scale 1.25 from Sway
monitor = eDP-1, 1920x1080@60.050, 0x0, 1.25
monitor = , preferred, auto, 1

# ── Section ──
# Input
input {
    kb_layout = us
    repeat_rate = 50
    repeat_delay = 300
    follow_mouse = 1
    
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
        middle_button_emulation = true
    }
}

# ── Section ──
# Cursor
cursor {
    default_monitor = eDP-1
}

# ── Section ──
# General Appearance (SwayFX / Tokyo Night parity)
general {
    gaps_in = 2
    gaps_out = 1
    border_size = 2
    col.active_border = rgba(39c5bbee)
    col.inactive_border = rgba(24283baa)
    layout = dwindle
}

dwindle {
    preserve_split = true
}

decoration {
    rounding = 10
    dim_inactive = true
    dim_strength = 0.15
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 7
        passes = 4
    }

    shadow {
        enabled = true
        range = 20
        color = rgba(15161ecc)
    }
}

animations {
    enabled = true
    bezier = easeOut, 0.23, 1, 0.32, 1
    bezier = snappy, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 5, easeOut
    animation = windowsOut, 1, 5, default, popin 80%
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, snappy, slide
    animation = border, 1, 8, default
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ── Section ──
# Environment Variables
env = XCURSOR_THEME,breeze_cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,adw-gtk3-dark
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_STYLE_OVERRIDE,kvantum
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*

# ── Section ──
# Autostart
# Session / portals
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start xdg-desktop-portal-hyprland.service

# Wallpaper (swww with automatic fallback to swaybg)
exec-once = swww-daemon || swaybg -i /home/dipak/code/arch-theme/wallpapers/satisfaction_waybar_blur.png -m fill
exec-once = sleep 0.5 && swww img /home/dipak/code/arch-theme/wallpapers/satisfaction_waybar_blur.png --transition-type grow --transition-duration 1

# Shell & idle
exec-once = quickshell
exec-once = hypridle

# System services
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = nm-applet --indicator
exec-once = wl-paste --type text --watch clipse -wl-store
exec-once = wl-paste --type image --watch clipse -wl-store
exec-once = sway-audio-idle-inhibit

# GSettings sync (Cursor, Theme, Icons, Fonts)
exec-once = gsettings set org.gnome.desktop.interface cursor-theme breeze_cursors
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
exec-once = gsettings set org.gnome.desktop.sound theme-name Pop
exec-once = gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-dark
exec-once = gsettings set org.gnome.desktop.interface icon-theme TokyoNight-SE
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = gsettings set org.gnome.desktop.interface font-name 'IBM Plex Sans SmBld 10'
exec-once = gsettings set org.gnome.desktop.interface monospace-font-name 'FiraCode Nerd Font 10'

# Brightness restore on boot
exec-once = sh -c 'val=$(cat /var/lib/systemd/backlight/* 2>/dev/null | head -n 1); if [ -n "$val" ]; then brightnessctl set "$val" -q; fi'

# ── Section ──
# Keybindings - App Launchers
bind = $mainMod, Return, exec, $term
bind = $mainMod, D, exec, quickshell ipc call launcher toggle
bind = $mainMod, E, exec, $file_explorer
bind = $mainMod, B, exec, $browser
bind = $mainMod, Z, exec, zeditor
bind = $mainMod SHIFT, Z, exec, zeditor -n
bind = $mainMod, V, exec, ~/.config/hypr/clipse-toggle.sh
bind = $mainMod, period, exec, quickshell ipc call emoji toggle
bind = $mainMod, Escape, exec, $term -e btop
bind = $mainMod, N, exec, quickshell ipc call notifications toggle

# ── Section ──
# Keybindings - Window Management
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, Space, togglefloating
bind = $mainMod, W, togglegroup
bind = $mainMod, P, pseudo

# ── Section ──
# Keybindings - Focus (Vim keys + Arrows)
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Right, movefocus, r

# ── Section ──
# Keybindings - Move Windows (Vim keys + Arrows)
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Down, movewindow, d
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Right, movewindow, r

# ── Section ──
# Keybindings - Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = , mouse:275, workspace, m+1
bind = , mouse:276, workspace, m-1

# ── Section ──
# Keybindings - Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ── Section ──
# Keybindings - Scratchpad
bind = $mainMod SHIFT, minus, movetoworkspace, special:scratchpad
bind = $mainMod, minus, togglespecialworkspace, scratchpad

# ── Section ──
# Keybindings - Screenshots & Recording
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/screenshot.sh region
bind = , Print, exec, ~/.config/hypr/screenshot.sh menu
bind = $mainMod, Print, exec, ~/.config/hypr/screenshot.sh full
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/toggle_recorder.sh

# ── Section ──
# Keybindings - Media (Locked + Repeatable)
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioStop, exec, playerctl stop
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+

# ── Section ──
# Keybindings - Resize Submap
bind = $mainMod, R, submap, resize
submap = resize
binde = , Right, resizeactive, 10 0
binde = , Left, resizeactive, -10 0
binde = , Up, resizeactive, 0 -10
binde = , Down, resizeactive, 0 10
binde = , L, resizeactive, 10 0
binde = , H, resizeactive, -10 0
binde = , K, resizeactive, 0 -10
binde = , J, resizeactive, 0 10
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

# ── Section ──
# Keybindings - Session
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, E, exec, quickshell ipc call power toggle

# ── Section ──
# Window & Layer Rules (Hyprland 0.56+ syntax)
windowrule = float, class:^(swappy)$
windowrule = float, class:^(org.pulseaudio.pavucontrol)$
windowrule = size 450 265, class:^(org.pulseaudio.pavucontrol)$
windowrule = move 875 0, class:^(org.pulseaudio.pavucontrol)$
windowrule = float, class:^(clipse)$
windowrule = size 800 600, class:^(clipse)$
windowrule = center, class:^(clipse)$
windowrule = idleinhibit fullscreen, class:^(.*)$

layerrule = blur, quickshell
layerrule = ignorezero, quickshell
layerrule = blurpopups, quickshell

# Ly display manager configuration file
# Customized for Miku/Tokyo Night Arch Linux dotfiles

# TTY console to run Ly on
tty = 2

# Top title box string
box_title = "Arch Linux"

# Use large ASCII art clock
bigclock = false

# Clock display format
clock = %c

# Animation type (0 = none, matrix, doom, etc.)
animation = 0

# Background color index (0-15 in TTY palette; 0 is Miku dark blue #1a1b26)
bg = 0

# Foreground text color index (7 is Miku text #c0caf5)
fg = 7

# Border color index (6 is Miku Teal #39c5bb)
border_fg = 6

# Color index for the active/focused item (14 is bright Miku teal #39c5bb)
active_user_fg = 14

# Blank the main box when password is empty
blank_box = true

# Clear empty password automatically
clear_empty_password = true

# Default selected input index (2 = password field)
default_input = 2

# Hide outer borders (false to show the themed box border)
hide_borders = false

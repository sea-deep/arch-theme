# ══════════════════════════════════════════════════════════════════════════════
#  MPV KEYBINDINGS & CONTROLS
#  Intuitive, standard media shortcuts with Vim navigation and smooth seeking
# ══════════════════════════════════════════════════════════════════════════════

# Playback & Pause
SPACE       cycle pause
p           cycle pause

# Seeking (Arrow keys & Vim h/l)
RIGHT       seek  5
LEFT        seek -5
UP          add volume  2
DOWN        add volume -2
l           seek  5
h           seek -5
k           add volume  2
j           add volume -2

# Large Seeks
Shift+RIGHT seek  30
Shift+LEFT  seek -30
Ctrl+RIGHT  seek  60
Ctrl+LEFT   seek -60

# Volume & Mute
m           cycle mute
WHEEL_UP    add volume  2
WHEEL_DOWN  add volume -2
WHEEL_LEFT  seek -5
WHEEL_RIGHT seek  5

# Speed adjustments
[           multiply speed 1/1.1
]           multiply speed 1.1
{           multiply speed 0.5
}           multiply speed 2.0
BS          set speed 1.0

# Display & Fullscreen
f           cycle fullscreen
F11         cycle fullscreen
ESC         set fullscreen no

# Audio & Subtitle tracks
v           cycle sub-visibility
_           cycle sub
V           cycle sub down
a           cycle audio
A           cycle audio down

# Screenshots
s           screenshot
S           screenshot video
Ctrl+s      screenshot window

# Window & Exit
q           quit
Q           quit-watch-later

# ══════════════════════════════════════════════════════════════════════════════
#  MPV — TOKYO NIGHT × HATSUNE MIKU RICE
#  Wayland-native GPU acceleration, Tokyo Night OSD, and fluid controls
# ══════════════════════════════════════════════════════════════════════════════

# ── Video & Hardware Acceleration ─────────────────────────────────────────────
vo=gpu-next
gpu-api=auto
gpu-context=wayland
hwdec=auto-safe
dither-depth=auto

# Fluid presentation & pacing
video-sync=display-resample
interpolation=yes
tscale=oversample

# ── Audio & Codecs ────────────────────────────────────────────────────────────
ao=pipewire,pulse
volume=100
volume-max=150
audio-file-auto=fuzzy
audio-channels=stereo

# ── Window & Behavior ─────────────────────────────────────────────────────────
save-position-on-quit=yes
keep-open=yes
cursor-autohide=1000
autofit-larger=85%x85%
geometry=50%:50%
force-window=immediate

# ── Tokyo Night Typography & Subtitles ────────────────────────────────────────
sub-font="IBM Plex Sans SmBld"
sub-font-size=38
sub-color="#c0caf5"
sub-border-color="#16161e"
sub-border-size=2.5
sub-shadow-offset=1.2
sub-shadow-color="#1a1b26"
sub-auto=fuzzy
sub-bold=yes

# ── Tokyo Night OSD (On-Screen Display) ────────────────────────────────────────
osd-font="IBM Plex Sans SmBld"
osd-font-size=26
osd-color="#c0caf5"
osd-border-color="#16161e"
osd-border-size=2
osd-shadow-color="#1a1b26"
osd-shadow-offset=1
osd-bar-align-y=0.9
osd-bar-w=60
osd-bar-h=2.4
osd-bar-border-size=1

# ── Screenshots (High Quality PNG) ────────────────────────────────────────────
screenshot-format=png
screenshot-template="~/Pictures/Screenshots/MPV_%F_%P"
screenshot-high-bit-depth=yes
screenshot-png-compression=7

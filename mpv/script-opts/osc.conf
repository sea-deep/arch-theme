# ══════════════════════════════════════════════════════════════════════════════
#  MPV OSC (ON-SCREEN CONTROLLER) CONFIGURATION
#  Sleek floating bottom bar with Tokyo Night transparency and modern controls
# ══════════════════════════════════════════════════════════════════════════════

layout=bottombar
seekbarstyle=bar
seekbarhandlesize=0.7
seekrangestyle=bar
seekrangealpha=128

deadzonesize=0.5
minmousemove=3
showwindowed=yes
showfullscreen=yes

scalewindowed=1.05
scalefullscreen=1.2
vidscale=no

boxalpha=130
hidetimeout=1000
fadeduration=200
fadein=yes

timetotal=yes
remaining_playtime=yes
timems=no
visibility=auto
tooltipborder=1
